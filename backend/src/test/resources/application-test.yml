# 测试用真实的 MySQL 和 Redis（C37）：CI 里是 GitHub 提供的服务容器，本地用 Docker 起同样的容器。
# 地址有默认值；数据库密码只从环境变量 FX_DB_PASSWORD 读取（CI 里是测试容器的一次性密码）。
spring:
  datasource:
    url: ${FX_DB_URL:jdbc:mysql://localhost:3306/falconx_test}
    username: ${FX_DB_USERNAME:root}
    password: ${FX_DB_PASSWORD}
    # 测试会缓存多个 Spring 上下文，每个都有连接池；限小一些，避免超过 MySQL 默认的 151 个连接
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
management:
  server:
    port: 0
falconx:
  # 测试里不启动模拟行情源，由测试直接喂报价
  market:
    source: none
  # 撮合引擎默认关：其他测试手动平仓时不会被引擎抢先强平；撮合测试里单独打开
  trading:
    engine-enabled: false
  storage:
    local-dir: ${java.io.tmpdir}/falconx-test-storage
