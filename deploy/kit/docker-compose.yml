# 测试环境的容器（S20，部署方案 v1.1 第 4 节）。放在服务器 /opt/falconx/，由 deploy.sh 用两个变量文件启动：
#   .env               ← 密钥和域名，只由 Amos 填（变量名见 env.example），权限 600
#   state/image.env    ← 当前版本 IMAGE_TAG=<提交号>（deploy.sh、rollback.sh 写）
# 内存上限按 2 核 2G 服务器设置（部署方案第 2 节）；数据库、Redis、后端端口都不对公网开放。
name: falconx

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  web:
    image: ghcr.io/dollar3651314/falconx-lite-web:${IMAGE_TAG:?缺少 IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?缺少 APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?缺少 ADMIN_DOMAIN}
      # 官网（v2，部署方案第 14 节）。已有服务器的 .env 还没加时用一个不会被访问到的占位域名，Nginx 照常启动，官网那一段不生效
      WWW_DOMAIN: ${WWW_DOMAIN:-www-not-configured.invalid}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    mem_limit: 64m
    logging: *logging

  app:
    image: ghcr.io/dollar3651314/falconx-lite-app:${IMAGE_TAG:?缺少 IMAGE_TAG}
    restart: unless-stopped
    # 只给本机的部署脚本做健康检查，不对公网开放（云防火墙也只开 80、443）
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FX_DB_URL: jdbc:mysql://mysql:3306/falconx?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      FX_DB_USERNAME: falconx
      FX_DB_PASSWORD: ${FX_DB_PASSWORD:?缺少 FX_DB_PASSWORD}
      FX_REDIS_HOST: redis
      FX_REDIS_PASSWORD: ${FX_REDIS_PASSWORD:?缺少 FX_REDIS_PASSWORD}
      FX_COOKIE_SECURE: "true"
      FX_ENV_LABEL: test
      FX_MARKET_SOURCE: ${FX_MARKET_SOURCE:-simulated}
      # 真实报价源（v2，部署方案第 16 节）：token 空着 = 不用这家；都空着时全部模拟（和以前一样）。其余空着时用代码里的默认值
      FX_QUOTE_ALLTICK_TOKEN: ${FX_QUOTE_ALLTICK_TOKEN:-}
      FX_QUOTE_ITICK_TOKEN: ${FX_QUOTE_ITICK_TOKEN:-}
      FX_QUOTE_ALLTICK_FX_URL: ${FX_QUOTE_ALLTICK_FX_URL:-wss://quote.alltick.co/quote-b-ws-api}
      FX_QUOTE_ALLTICK_STOCK_URL: ${FX_QUOTE_ALLTICK_STOCK_URL:-wss://quote.alltick.co/quote-stock-b-ws-api}
      FX_QUOTE_ITICK_URL: ${FX_QUOTE_ITICK_URL:-wss://api.itick.org}
      FX_QUOTE_PRIMARY: ${FX_QUOTE_PRIMARY:-alltick}
      FX_QUOTE_FAILOVER_AFTER: ${FX_QUOTE_FAILOVER_AFTER:-10s}
      FX_QUOTE_FAILBACK_AFTER: ${FX_QUOTE_FAILBACK_AFTER:-30s}
      FX_QUOTE_MAX_DEVIATION: ${FX_QUOTE_MAX_DEVIATION:-0.005}
      FX_QUOTE_USDT_USD_RATE: ${FX_QUOTE_USDT_USD_RATE:-1}
      # 币安公开行情（技术方案第 12 节，部署方案第 16.6 节）：不要 token，默认关闭；Amos 决定后在 .env 设 FX_QUOTE_BINANCE_ENABLED=true
      FX_QUOTE_BINANCE_ENABLED: ${FX_QUOTE_BINANCE_ENABLED:-false}
      FX_QUOTE_BINANCE_SPOT_WS_URL: ${FX_QUOTE_BINANCE_SPOT_WS_URL:-wss://data-stream.binance.vision}
      FX_QUOTE_BINANCE_FUTURES_ENABLED: ${FX_QUOTE_BINANCE_FUTURES_ENABLED:-false}
      FX_QUOTE_BINANCE_FUTURES_WS_URL: ${FX_QUOTE_BINANCE_FUTURES_WS_URL:-wss://fstream.binance.com/public}
      # 官网默认只显示示例行情（模拟价）；拿到书面展示授权后才改 live
      FX_PUBLIC_QUOTES_SOURCE: ${FX_PUBLIC_QUOTES_SOURCE:-simulated}
      FX_ADMIN_INIT_USERNAME: ${FX_ADMIN_INIT_USERNAME:-}
      FX_ADMIN_INIT_PASSWORD: ${FX_ADMIN_INIT_PASSWORD:-}
      FX_MAIL_HOST: ${FX_MAIL_HOST:-}
      FX_MAIL_PORT: ${FX_MAIL_PORT:-587}
      FX_MAIL_SECURITY: ${FX_MAIL_SECURITY:-STARTTLS}
      FX_MAIL_USERNAME: ${FX_MAIL_USERNAME:-}
      FX_MAIL_PASSWORD: ${FX_MAIL_PASSWORD:-}
      FX_MAIL_FROM: ${FX_MAIL_FROM:-}
      FX_PUSH_VAPID_PUBLIC_KEY: ${FX_PUSH_VAPID_PUBLIC_KEY:-}
      FX_PUSH_VAPID_PRIVATE_KEY: ${FX_PUSH_VAPID_PRIVATE_KEY:-}
      FX_PUSH_VAPID_SUBJECT: ${FX_PUSH_VAPID_SUBJECT:-}
      FX_RISK_ALERT_EMAILS: ${FX_RISK_ALERT_EMAILS:-}
      # 监控告警收件人（v2 E8）：默认值写在这里，不写在代码里；.env 里填了就用 .env 的
      FX_ALERT_EMAILS: ${FX_ALERT_EMAILS:-info@quickcome.online}
      # 雪花 ID 节点号（单实例 1）
      FX_ID_NODE: ${FX_ID_NODE:-1}
      # 区块链（D4 第二步才填，全部用测试网）；没配置的链不扫块
      FX_WALLET_ETH_XPUB: ${FX_WALLET_ETH_XPUB:-}
      FX_WALLET_TRON_XPUB: ${FX_WALLET_TRON_XPUB:-}
      FX_WALLET_ETH_RPC_URL: ${FX_WALLET_ETH_RPC_URL:-}
      FX_WALLET_BSC_RPC_URL: ${FX_WALLET_BSC_RPC_URL:-}
      FX_WALLET_TRON_RPC_URL: ${FX_WALLET_TRON_RPC_URL:-}
      FX_WALLET_ERC20_USDT_CONTRACT: ${FX_WALLET_ERC20_USDT_CONTRACT:-}
      FX_WALLET_BSC_USDT_CONTRACT: ${FX_WALLET_BSC_USDT_CONTRACT:-}
      FX_WALLET_TRC20_USDT_CONTRACT: ${FX_WALLET_TRC20_USDT_CONTRACT:-}
      FX_WALLET_ERC20_CHAIN_ID: ${FX_WALLET_ERC20_CHAIN_ID:-11155111}
      FX_WALLET_BSC_CHAIN_ID: ${FX_WALLET_BSC_CHAIN_ID:-97}
      FX_WALLET_ETH_HOT_KEY: ${FX_WALLET_ETH_HOT_KEY:-}
      FX_WALLET_TRON_HOT_KEY: ${FX_WALLET_TRON_HOT_KEY:-}
      FX_WALLET_ETH_HOT_ADDRESS: ${FX_WALLET_ETH_HOT_ADDRESS:-}
      FX_WALLET_TRON_HOT_ADDRESS: ${FX_WALLET_TRON_HOT_ADDRESS:-}
      # 资金归集（v2 第一阶段：以太坊、BSC）：合约地址都是公开地址，发起账户私钥只由 Amos 填；都不填时和以前一样（xpub 地址、不能归集）
      FX_SWEEP_EVM_FACTORY: ${FX_SWEEP_EVM_FACTORY:-}
      FX_SWEEP_EVM_IMPLEMENTATION: ${FX_SWEEP_EVM_IMPLEMENTATION:-}
      FX_SWEEP_EVM_PARENT: ${FX_SWEEP_EVM_PARENT:-}
      FX_SWEEP_EVM_BATCHER: ${FX_SWEEP_EVM_BATCHER:-}
      FX_SWEEP_EVM_OPERATOR_ADDRESS: ${FX_SWEEP_EVM_OPERATOR_ADDRESS:-}
      FX_SWEEP_EVM_OPERATOR_KEY: ${FX_SWEEP_EVM_OPERATOR_KEY:-}
    volumes:
      - ./data/storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 单实例：停机时先停止接收新订单、处理完队列再退出（架构方案 3.3 ⑦）
    stop_grace_period: 60s
    mem_limit: 768m
    memswap_limit: 1g
    logging: *logging

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?缺少 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: falconx
      MYSQL_USER: falconx
      MYSQL_PASSWORD: ${FX_DB_PASSWORD:?缺少 FX_DB_PASSWORD}
      TZ: UTC
    # 2G 内存：调小缓存、关闭性能监控（部署方案第 2 节）
    command:
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=60
      - --innodb-log-buffer-size=8M
      - --key-buffer-size=8M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 450m
    memswap_limit: 700m
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    # 密码从容器的环境变量读，不写进 compose 的命令行
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 64mb --maxmemory-policy noeviction --save 300 10"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${FX_REDIS_PASSWORD:?缺少 FX_REDIS_PASSWORD}
    mem_limit: 96m
    logging: *logging
